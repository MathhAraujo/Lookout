[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookout"
version = "0.1.0"
description = "Local-first job collection and resume tailoring agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
    "apscheduler>=3.10,<4",
    "httpx",
    "pydantic-settings",
    "jinja2",
    "weasyprint",
    "rapidfuzz",
    "feedparser",
    "python-frontmatter",
    "pyyaml",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pypdf"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/lookout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
