services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lookout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lookout}
      POSTGRES_DB: ${POSTGRES_DB:-lookout}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init/create_infisical_database.sql:/docker-entrypoint-initdb.d/02-create_infisical_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-lookout-artifacts}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      INFISICAL_URL: ${INFISICAL_URL:-http://infisical:8080}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/application}
      DRY_RUN: ${DRY_RUN:-true}
      AUTO_SUBMIT_ENABLED: ${AUTO_SUBMIT_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PASSWORD_SECRET_NAME: ${SMTP_PASSWORD_SECRET_NAME:-SMTP_PASSWORD}
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
      - "127.0.0.1:${GMAIL_AUTH_PORT:-8765}:${GMAIL_AUTH_PORT:-8765}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-lookout-artifacts}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      INFISICAL_URL: ${INFISICAL_URL:-http://infisical:8080}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/application}
      DRY_RUN: ${DRY_RUN:-true}
      AUTO_SUBMIT_ENABLED: ${AUTO_SUBMIT_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PASSWORD_SECRET_NAME: ${SMTP_PASSWORD_SECRET_NAME:-SMTP_PASSWORD}
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
